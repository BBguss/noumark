[package]
name = "noumark"
version = "0.1.0"
description = "Noumark - a fast, beautiful Markdown reader & editor for Windows"
authors = ["Bbguss"]
license = "MIT"
repository = "https://github.com/BBguss/noumark"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
